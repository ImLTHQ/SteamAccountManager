name: 打包并发布 Release

# 触发条件：version 文件被改动（也可以在 Actions 页面手动触发）
on:
  push:
    branches:
      - main
    paths:
      - 'version'
  workflow_dispatch:

# 创建 Release / 打 tag 需要写权限
permissions:
  contents: write

# 同一分支上的发布串行执行，避免两个版本同时建 Release
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Windows 打包并发布
    # 账号管理系统 用了 winreg / tkinter，只能在 Windows 上打包
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 读取 version 文件
        id: ver
        shell: pwsh
        run: |
          $version = (Get-Content version -Raw).Trim()
          if (-not $version) { throw 'version 文件内容为空' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version"   >> $env:GITHUB_OUTPUT
          Write-Host "本次发布版本: $version"

      # 必须用 3.13：pysteamauth 依赖 pydantic 1.9，
      # 在 Python 3.14 下 pydantic 解析最终登录结果会失败
      # （'FinalizeLoginStatus' object has no attribute 'transfer_info'），
      # 打出来的 exe 会登录不了 Steam。
      - name: 安装 Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 安装依赖
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pysteamauth==1.1.2 pypinyin pytz pyinstaller==6.14.1

      # 程序内的 version 常量要和 version 文件一致，
      # 否则发布出去的 exe 会对所有用户一直提示"有新版本"。
      # 不一致时只在打包前对齐（不会提交回仓库），并打一条 warning。
      - name: 对齐脚本内的 version 常量
        shell: pwsh
        run: |
          $want = '${{ steps.ver.outputs.version }}'
          $path = 'Program/账号管理系统.py'
          $text = [System.IO.File]::ReadAllText($path)
          $match = [regex]::Match($text, '(?m)^version = "(.+?)"')
          if (-not $match.Success) { throw '没在脚本里找到 version 常量' }
          $now = $match.Groups[1].Value
          if ($now -ne $want) {
            Write-Host "::warning::$path 里的 version 常量是 $now，与 version 文件($want)不一致，已在打包时对齐"
            $replacement = 'version = "' + $want + '"'
            $text = [regex]::Replace($text, '(?m)^version = ".+?"', $replacement)
            [System.IO.File]::WriteAllText($path, $text, (New-Object System.Text.UTF8Encoding($false)))
          } else {
            Write-Host "脚本内 version 常量与 version 文件一致: $now"
          }

      # 指定 pwsh（PowerShell 7）：脚本路径含中文，
      # PS 5.1 会按 ANSI 解析命令里的中文路径，容易乱码找不到文件
      # 产物统一命名 SteamAccountManager.exe（源码文件名保持中文不动）
      - name: PyInstaller 打包
        shell: pwsh
        run: pyinstaller --noconsole --onefile --noconfirm --name SteamAccountManager ./Program/账号管理系统.py

      - name: 检查打包产物
        shell: pwsh
        run: |
          $exe = 'dist/SteamAccountManager.exe'
          if (-not (Test-Path $exe)) { throw "没有找到打包产物: $exe" }
          $file = Get-Item $exe
          Write-Host ("产物: {0}  {1:N2} MB" -f $file.Name, ($file.Length / 1MB))

      # Release 说明 = 版本号 + 最新一次提交的内容
      - name: 生成 Release 说明
        shell: pwsh
        env:
          # push 事件直接带提交说明，用它最稳（不用经过 git/控制台编码）
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          $version = '${{ steps.ver.outputs.version }}'
          $message = $env:COMMIT_MESSAGE
          if (-not $message -or -not $message.Trim()) {
            # 手动触发时没有 head_commit，退回读仓库最后一次提交
            [Console]::OutputEncoding = New-Object System.Text.UTF8Encoding($false)
            $message = (git log -1 --pretty=%B) -join "`n"
          }
          if (-not $message.Trim()) { $message = '(本次提交没有填写说明)' }
          $notes = "版本：$version`n`n$($message.Trim())`n"
          [System.IO.File]::WriteAllText('release_notes.md', $notes, (New-Object System.Text.UTF8Encoding($false)))
          Write-Output '--- Release 说明 ---'
          Get-Content -Path release_notes.md -Encoding UTF8

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          body_path: release_notes.md
          files: dist/SteamAccountManager.exe
          fail_on_unmatched_files: true
